services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: stock-ai-postgres
    environment:
      POSTGRES_DB: stock_ai
      POSTGRES_USER: stock_ai
      POSTGRES_PASSWORD: ${STOCKAI_DATABASE_PASSWORD:-stock_ai}
    ports:
      - "${STOCK_AI_POSTGRES_PORT:-5432}:5432"
    volumes:
      - stock_ai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_ai -d stock_ai"]
      interval: 5s
      timeout: 3s
      retries: 20

  stock-ai-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-ai-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${STOCK_AI_HOST_PORT:-18080}:8080"
    environment:
      STOCKAI_DATABASE_URL: jdbc:postgresql://postgres:5432/stock_ai
      STOCKAI_DATABASE_USERNAME: stock_ai
      STOCKAI_DATABASE_PASSWORD: ${STOCKAI_DATABASE_PASSWORD:-stock_ai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      MIMO_MODEL: ${MIMO_MODEL:-mimo-v2.5-pro}
      MIMO_CHAT_COMPLETIONS_URL: ${MIMO_CHAT_COMPLETIONS_URL:-https://api.xiaomimimo.com/v1/chat/completions}
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-}
      FINMIND_API_TOKEN: ${FINMIND_API_TOKEN:-}
      FINMIND_BASE_URL: ${FINMIND_BASE_URL:-https://api.finmindtrade.com/api/v4}
      FMP_API_KEY: ${FMP_API_KEY:-}
      STOCKAI_TWSE_DISCLOSURE_URL: ${STOCKAI_TWSE_DISCLOSURE_URL:-}
      STOCKAI_AUTH_SECRET: ${STOCKAI_AUTH_SECRET:-}
    volumes:
      - stock_ai_data:/app/backend/data

volumes:
  stock_ai_data:
  stock_ai_postgres:
