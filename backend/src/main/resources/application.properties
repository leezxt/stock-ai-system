spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
stockai.rag.relevance-threshold=${STOCKAI_RAG_RELEVANCE_THRESHOLD:0.15}
stockai.rag.embedding.provider=${STOCKAI_RAG_EMBEDDING_PROVIDER:hash}
stockai.rag.embedding.api-key=${STOCKAI_RAG_EMBEDDING_API_KEY:${OPENAI_API_KEY:}}
stockai.rag.embedding.url=${STOCKAI_RAG_EMBEDDING_URL:https://api.openai.com/v1/embeddings}
stockai.rag.embedding.model=${STOCKAI_RAG_EMBEDDING_MODEL:${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}}
stockai.rag.embedding.dimension=${STOCKAI_RAG_EMBEDDING_DIMENSION:16}
stockai.watchlist.alerts.scheduler.enabled=${STOCKAI_WATCHLIST_ALERTS_SCHEDULER_ENABLED:false}
stockai.watchlist.alerts.scheduler.fixed-delay-ms=${STOCKAI_WATCHLIST_ALERTS_SCHEDULER_FIXED_DELAY_MS:900000}
stockai.watchlist.alerts.scheduler.initial-delay-ms=${STOCKAI_WATCHLIST_ALERTS_SCHEDULER_INITIAL_DELAY_MS:60000}
stockai.watchlist.alerts.notification-mode=${STOCKAI_WATCHLIST_ALERTS_NOTIFICATION_MODE:LOCAL_ONLY}
