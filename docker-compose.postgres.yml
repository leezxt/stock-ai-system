services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: stock-ai-postgres
    environment:
      POSTGRES_DB: stock_ai
      POSTGRES_USER: stock_ai
      POSTGRES_PASSWORD: stock_ai
    ports:
      - "5432:5432"
    volumes:
      - stock_ai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_ai -d stock_ai"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  stock_ai_postgres:
